# פריסה אוטומטית ל-Cloud Run.
#
# עד כאן מיזוג ל-main לא פרס כלום, והשירות דרש פריסה ידנית שקל לשכוח —
# כך נוצר מצב שבו התיקון היה ב-main אבל לא אצל המשתמש.
#
# הבדיקות רצות לפני הפריסה, ופריסה אינה יוצאת לדרך אם הן נכשלו.
#
# חשוב: אין כאן הגדרת env vars בכוונה. השירות קורא OPENAI_API_KEY,
# OPENAI_MODEL ו-OPENAI_RETRY_MODEL מהסביבה של Cloud Run, ופריסה שמגדירה
# משתנים מחליפה את *כל* הקיימים. השארתם ריקים משמר את מה שכבר מוגדר בשירות.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'scan-verification.js'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  SERVICE: berman-ai-scan
  REGION: europe-west1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # נדרש ל-Workload Identity Federation
    steps:
      # בלי הרשאות מוגדרות הריצה מסתיימת ירוקה עם הסבר, ולא נכשלת אדום
      # בכל מיזוג. כך אפשר למזג את הקובץ הזה לפני שמחברים את ההרשאה.
      - id: config
        env:
          WIF: ${{ secrets.GCP_WIF_PROVIDER }}
          SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$WIF" ] && [ -n "$SA" ]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.mode == 'none'
        run: |
          echo "::notice title=הפריסה אינה מחוברת::הוסף GCP_WIF_PROVIDER + GCP_SERVICE_ACCOUNT (מומלץ) או GCP_SA_KEY ב-Settings → Secrets → Actions. עד אז השירות דורש פריסה ידנית."

      - uses: actions/checkout@v4
        if: steps.config.outputs.mode != 'none'

      - name: Authenticate (Workload Identity)
        if: steps.config.outputs.mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate (service account key)
        if: steps.config.outputs.mode == 'key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy
        if: steps.config.outputs.mode != 'none'
        id: run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: .

      # פריסה שעלתה אך אינה עונה גרועה מפריסה שנכשלה, כי היא נראית ירוקה.
      - name: Smoke check /health
        if: steps.config.outputs.mode != 'none'
        run: |
          url="${{ steps.run.outputs.url }}/health"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt $attempt: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error title=השירות אינו עונה אחרי הפריסה::$url לא החזיר 200"
          exit 1
